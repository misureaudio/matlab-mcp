[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-mcp-server"
version = "0.1.0"
description = "MCP server for MATLAB batch mode execution"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
engine = ["matlab.engine"]

[project.scripts]
matlab-mcp-server = "server:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["src"]
